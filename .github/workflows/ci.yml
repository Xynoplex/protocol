name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            conformance/package-lock.json
      - run: make validate
      - run: git diff --exit-code -- specs/openapi.json specs/archivist.openapi.json
