version: 2

# One pull request, twice a month at most: the npm updates are one group,
# proposed on the 1st and the 15th, with no more than one PR open. A release
# waits a week before it is proposed, and a major release a month.

# Security updates are grouped the same way, in a group of each entry's own,
# and Dependabot raises them when an advisory is published, not on the
# schedule; neither the cooldown nor the one-PR limit holds them back.

updates:
  - package-ecosystem: npm
    labels: ["dependencies"]
    directories:
      - /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        patterns: ["*"]
