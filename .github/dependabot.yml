version: 2

# One pull request, twice a month at most: the npm updates of both packages
# are one group, proposed on the 1st and the 15th, with no more than one PR
# open. A release waits a week before it is proposed, and a major release a
# month.

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /conformance
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The conformance harness generates its types with openapi-typescript,
      # which needs TypeScript's JavaScript API, and TypeScript 7 has none.
      - dependency-name: typescript
        versions: [">=7"]
